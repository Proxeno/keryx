name: pack
on:
  push:
    tags: ['v*']
jobs:
  pack-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derive version from tag
        run: echo "KERYX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet pack Keryx.slnx --configuration Release -p:Version=$KERYX_VERSION -o artifacts/packages
      # Feed is GitHub Packages while the repo is private; open-sourcing flips this URL to nuget.org.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/Proxeno/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
